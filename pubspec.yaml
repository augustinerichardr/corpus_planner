name: corpus_planner
description: "A professional multi-currency wealth compounding and retirement SWP planner."
publish_to: 'none'

version: 1.0.0+11

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI Icons & Formatting
  cupertino_icons: ^1.0.8
  intl: ^0.20.3

  # Charts & Visualizations
  fl_chart: ^1.2.0

  # Local Storage & API Networking
  shared_preferences: ^2.5.5
  http: ^1.6.0

  # QR Codes & UPI / App Launching
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2

  # PDF Generation, Printing & Export
  pdf: ^3.12.0
  printing: ^5.14.3
  file_saver: ^0.3.1

  # Audio & Speech
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true