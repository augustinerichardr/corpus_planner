name: corpus_planner
description: "A professional multi-currency wealth compounding and retirement SWP planner."
publish_to: 'none'

version: 1.0.0+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI, Fonts & Internationalization
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # AI & Dynamic LLM Translation Engine
  google_generative_ai: ^0.4.0

  # Charts & Visualizations
  fl_chart: ^1.2.0

  # Local Storage & API Networking
  shared_preferences: ^2.3.5
  http: ^1.2.2
  path_provider: ^2.1.2

  # Text-to-Speech
  flutter_tts: ^4.2.2

  # QR Codes, UPI & External Launchers
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1

  # PDF Generation, Printing & Export
  pdf: ^3.12.0
  printing: ^5.14.3
  file_saver: ^0.3.1

  # In-App Purchases (Google Play & App Store Compliance)
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true